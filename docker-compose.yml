# Переменные: автоматически из `.env` в корне (если есть) или значения по умолчанию ниже.
# Эталон для копирования: compose.env  |  переопределение: скопируй compose.env → .env
services:

  # POSTGRES_* из .env действуют только при пустом data-dir. Старые кластеры подтягивает postgres-role-sync.
  # Ручной вариант: sh scripts/postgres-migrate-role.sh
  postgres:
    image: postgres:16-alpine
    container_name: postgres-local
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_pg_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-748b0724049e17eaa919dc5ceb09c135d1a6fe45}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ./crm-tg-app-postgress/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' || psql -U admin -d \"$$POSTGRES_DB\" -c 'SELECT 1' || psql -U postgres -d \"$$POSTGRES_DB\" -c 'SELECT 1' || exit 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Делит network namespace с postgres → подключение к 127.0.0.1:5432 с trust (как в официальном pg_hba).
  postgres-role-sync:
    image: postgres:16-alpine
    container_name: postgres-role-sync
    restart: "no"
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-crm_pg_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-748b0724049e17eaa919dc5ceb09c135d1a6fe45}
    volumes:
      - ./scripts/postgres-role-sync.sh:/postgres-role-sync.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - sed 's/\r$//' /postgres-role-sync.sh | /bin/sh

  # Креды первого входа задаются в compose.env (не только через ${} — так надёжнее). Переопределение: корневой .env.
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-local
    restart: always
    ports:
      - "5050:80"
    depends_on:
      postgres-role-sync:
        condition: service_completed_successfully
    env_file:
      - compose.env
      - path: .env
        required: false
    environment:
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:7-alpine
    container_name: valkey-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  crm-tg-app:
    build:
      context: ./crm-tg-app
      dockerfile: Dockerfile
    container_name: crm-tg-app
    volumes:
      - ./crm-tg-app:/app
      - crm-tg-app-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DOCKER=1
      - CHOKIDAR_USEPOLLING=true
      - NUXT_API_BASE=http://crm-tg-app-backend:3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  crm-tg-app-backend:
    build:
      context: ./crm-tg-app-backend
      dockerfile: Dockerfile
    container_name: crm-tg-app-backend
    depends_on:
      postgres:
        condition: service_healthy
      postgres-role-sync:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    volumes:
      - ./crm-tg-app-backend:/app
      - crm-tg-app-backend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crm_pg_app}:${POSTGRES_PASSWORD:-748b0724049e17eaa919dc5ceb09c135d1a6fe45}@postgres:5432/${POSTGRES_DB:-app}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB_USER=${POSTGRES_USER:-crm_pg_app}
      - POSTGRES_DB_PASSWORD=${POSTGRES_PASSWORD:-748b0724049e17eaa919dc5ceb09c135d1a6fe45}
      - POSTGRES_DB_NAME=${POSTGRES_DB:-app}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VALKEY_URL=redis://valkey:6379
      - WSS_INTERNAL_URL=http://crm-tg-app-wss:3002
      - WSS_SHARED_SECRET=${WSS_SHARED_SECRET:-2d1484216f5b66453a561ff783666d2c392856e45b12d882}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api-doc', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    # Migrations run before app start (see Dockerfile CMD). To run migrate manually (e.g. from host):
    # docker compose run --rm crm-tg-app-backend npx prisma migrate deploy

  crm-tg-app-wss:
    build:
      context: ./crm-tg-app-wss
      dockerfile: Dockerfile
    container_name: crm-tg-app-wss
    depends_on:
      crm-tg-app-backend:
        condition: service_healthy
    volumes:
      - ./crm-tg-app-wss:/app
      - crm-tg-app-wss-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
      - BACKEND_INTERNAL_URL=http://crm-tg-app-backend:3000
      - WSS_INTERNAL_URL=http://crm-tg-app-wss:3002
      - WSS_SHARED_SECRET=${WSS_SHARED_SECRET:-2d1484216f5b66453a561ff783666d2c392856e45b12d882}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  cron:
    image: postgres:16-alpine
    container_name: cron
    depends_on:
      postgres:
        condition: service_healthy
      postgres-role-sync:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-crm_pg_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-748b0724049e17eaa919dc5ceb09c135d1a6fe45}
      PGDATABASE: ${POSTGRES_DB:-app}
    entrypoint: ["sh", "-c", "while true; do psql -c \"UPDATE users SET \\\"planId\\\" = 1 WHERE \\\"planExpiresAt\\\" IS NOT NULL AND \\\"planExpiresAt\\\" < NOW() AND \\\"planId\\\" != 1;\"; sleep 300; done"]
    healthcheck:
      test: ["CMD-SHELL", "psql -h $$PGHOST -U $$PGUSER -d $$PGDATABASE -c 'SELECT 1'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      crm-tg-app:
        condition: service_started
      crm-tg-app-backend:
        condition: service_healthy
      crm-tg-app-wss:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  pgadmin_data:
  valkey_data:
  crm-tg-app-node-modules:
  crm-tg-app-backend-node-modules:
  crm-tg-app-wss-node-modules:
